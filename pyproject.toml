[project]
name = "atla-workspace"
version = "0.0.0"
description = "uv workspace root for atla and atlagen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "atla",
    "atlagen",
    "aiosqlite>=0.20.0",
    "mypy>=1.15.0",
    "pyright>=1.1.400",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
]

[tool.uv.workspace]
members = ["packages/atla", "packages/atlagen"]

[tool.uv.sources]
atla = { workspace = true }
atlagen = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/atla/src", "packages/atlagen/src", "tests"]
extend-exclude = ["docs", "README.md"]
include = ["packages/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["atla", "atlagen"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["packages/atla/src", "packages/atlagen/src", "tests"]
exclude = ["**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["packages/atla/src", "packages/atlagen/src"]
files = [
    "packages/atla/src",
    "packages/atlagen/src",
    "tests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["packages/atla/src", "packages/atlagen/src"]
