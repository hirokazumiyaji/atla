[project]
name = "atla"
version = "0.1.0"
description = "Zero-overhead, compile-time type-safe SQL runtime core"
readme = { text = "Zero-overhead SQL runtime for Python with zero third-party dependencies.", content-type = "text/plain" }
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Hirokazu Miyaji" }]
keywords = ["sql", "async", "type-safe", "orm", "atlas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pg = ["asyncpg>=0.30.0"]
mysql = ["asyncmy>=0.2.9"]
sqlite = ["aiosqlite>=0.20.0"]
otel = ["opentelemetry-api>=1.20.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atla"]
