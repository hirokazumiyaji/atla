name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atla
          POSTGRES_PASSWORD: atla
          POSTGRES_DB: atla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atla -d atla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: atla
          MYSQL_DATABASE: atla
          MYSQL_USER: atla
          MYSQL_PASSWORD: atla
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uatla -patla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      ATLA_TEST_POSTGRES_DSN: postgresql://atla:atla@127.0.0.1:5432/atla
      ATLA_TEST_MYSQL_DSN: mysql://atla:atla@127.0.0.1:3306/atla

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest
